<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src https://rgs.jumpcut.cloud; frame-src 'self' https://play.jumpcut.cloud; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Jumpcut</title>
<meta name="description" content="Cinematic games and simulations, streamed instantly from the cloud. Play a live demo in your browser.">
<meta name="theme-color" content="#f2f4f5">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%230e2228'/%3E%3Cpolygon points='59.2,40 142.6,90 59.2,119.2' fill='%23f3e7d3'/%3E%3Cpolygon points='76,125.2 159.4,96 172,103.6 76,161.2' fill='%23f3e7d3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<link rel="modulepreload" href="carousel-logic.js">
<link rel="modulepreload" href="config.js">
<script type="module" src="site.js"></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <p class="logo">Jumpcut</p>
      <a class="top-mail" href="mailto:sales@jumpcut.cloud">sales@jumpcut.cloud</a>
    </header>

    <main class="main">
      <div class="intro">
        <h1 class="lead">Cinematic games and simulations, streamed instantly from the cloud.</h1>

        <div class="info" id="info">
          <p class="eyebrow">
            <span class="position" id="position">02 / 03</span>
            <span class="state" id="state" data-state="offline">Demo on request</span>
          </p>
          <h2 class="name" id="name">Slot</h2>
          <p class="pitch" id="pitch">Cinematic, instant time to fun.</p>
          <div class="action" id="action">
            <a class="button button-quiet" href="mailto:sales@jumpcut.cloud">Request a demo</a>
          </div>
          <p class="note" id="note"></p>
        </div>
      </div>

      <section class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Live demos">
        <div class="track" id="track"></div>
      </section>
      <p class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></p>
    </main>

    <footer class="foot">
      <p>For iGaming operators, game studios and simulation teams.</p>
      <a href="mailto:sales@jumpcut.cloud">sales@jumpcut.cloud</a>
    </footer>
  </div>
</body>
</html>
