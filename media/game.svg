<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="beam" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#2a5056"/>
      <stop offset="0.65" stop-color="#0e2228" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f3e7d3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f3e7d3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0e2228"/>
  <rect width="1600" height="900" fill="url(#beam)"/>
  <!-- arena walls, low poly -->
  <polygon points="0,560 0,250 180,300 260,560" fill="#132a30"/>
  <polygon points="1600,560 1600,250 1420,300 1340,560" fill="#132a30"/>
  <polygon points="260,560 330,330 480,360 520,560" fill="#1a363c"/>
  <polygon points="1340,560 1270,330 1120,360 1080,560" fill="#1a363c"/>
  <polygon points="520,560 560,420 660,440 680,560" fill="#22434a"/>
  <polygon points="1080,560 1040,420 940,440 920,560" fill="#22434a"/>
  <polygon points="330,330 480,360 420,420" fill="#24474d"/>
  <polygon points="1270,330 1120,360 1180,420" fill="#24474d"/>
  <!-- floor -->
  <polygon points="0,560 1600,560 1600,900 0,900" fill="#0a1a1f"/>
  <g stroke="#24474d" stroke-width="3" fill="none">
    <line x1="800" y1="560" x2="-400" y2="900"/>
    <line x1="800" y1="560" x2="200" y2="900"/>
    <line x1="800" y1="560" x2="600" y2="900"/>
    <line x1="800" y1="560" x2="1000" y2="900"/>
    <line x1="800" y1="560" x2="1400" y2="900"/>
    <line x1="800" y1="560" x2="2000" y2="900"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="0" y1="880" x2="1600" y2="880"/>
  </g>
  <!-- jump pad and its light -->
  <polygon points="700,700 900,700 860,200 740,200" fill="url(#shaft)"/>
  <ellipse cx="800" cy="700" rx="150" ry="34" fill="#24474d"/>
  <ellipse cx="800" cy="700" rx="150" ry="34" fill="none" stroke="#f3e7d3" stroke-width="6"/>
  <ellipse cx="800" cy="700" rx="96" ry="20" fill="none" stroke="#f3e7d3" stroke-opacity="0.5" stroke-width="4"/>
  <!-- floating marker -->
  <polygon points="800,300 852,380 800,460 748,380" fill="#f3e7d3"/>
  <polygon points="800,300 852,380 800,380" fill="#e8b86a"/>
  <polygon points="800,460 748,380 800,380" fill="#d9cdb8"/>
  <ellipse cx="800" cy="560" rx="40" ry="8" fill="#000" opacity="0.35"/>
  <!-- distant platforms -->
  <polygon points="420,500 560,500 540,520 440,520" fill="#2a5056"/>
  <polygon points="1040,480 1180,480 1160,500 1060,500" fill="#2a5056"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
